[project]
name = "devops-repo-auditing-agent"
version = "1.0.0"
description = "LLM-driven agent that audits public GitHub repositories for DevOps best-practice violations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "ruff>=0.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
